<div id="workmap-design-root"></div>
<style>
  :root {
    --ink: #080d22;
    --ink-soft: #121932;
    --jade: #27e0a2;
    --jade-light: #55e9b8;
    --amber: #f7b731;
    --paper: #f6f7f2;
    --white: #ffffff;
    --muted: #62697a;
    --rule: #dde1db;
    --coral: #ff645e;
    --green: #20a76f;
    --blue: #3478f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #d9ddda; font-family: Inter, "Segoe UI", Arial, sans-serif; }
  body { width: 1440px; height: 1000px; overflow: hidden; }
  button, input, select { font: inherit; }
  .screen { width: 1440px; height: 1000px; overflow: hidden; background: var(--paper); color: var(--ink); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; }
  .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 5px; font-size: 11px; font-weight: 900; }
  .eyebrow { margin: 0 0 9px; color: #087b5f; font-size: 11px; font-weight: 900; text-transform: uppercase; }
  .page-title { margin: 0; font-size: 42px; line-height: 1.04; font-weight: 800; }
  .subtitle { max-width: 710px; margin: 11px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
  .btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #aeb7b4; border-radius: 4px; background: var(--white); color: var(--ink); padding: 0 16px; font-size: 12px; font-weight: 800; }
  .btn.primary { border-color: var(--jade); background: var(--jade); }
  .btn.ink { border-color: var(--ink); background: var(--ink); color: var(--white); }
  .btn.disabled { color: #92999b; background: #eceeeb; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .badge { min-height: 24px; display: inline-flex; align-items: center; gap: 6px; width: fit-content; border: 1px solid var(--rule); border-radius: 999px; background: var(--white); padding: 0 9px; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .badge.jade { border-color: rgba(39,224,162,.55); background: rgba(39,224,162,.1); color: #087b5f; }
  .badge.amber { border-color: rgba(247,183,49,.8); background: rgba(247,183,49,.12); color: #76520a; }
  .badge.coral { border-color: rgba(255,100,94,.55); background: rgba(255,100,94,.08); color: #a5312c; }
  .panel { border: 1px solid var(--rule); border-radius: 6px; background: var(--white); }
  .panel-title { margin: 0; font-size: 18px; line-height: 1.25; }
  .small { color: var(--muted); font-size: 11px; line-height: 1.45; }
  .rule { height: 1px; background: var(--rule); }
  .field { display: grid; gap: 7px; }
  .field label { color: var(--muted); font-size: 11px; font-weight: 800; }
  .field input, .field select { width: 100%; height: 44px; border: 1px solid #bdc6c2; border-radius: 4px; background: var(--white); padding: 0 12px; color: var(--ink); }
  .pixel { image-rendering: pixelated; object-fit: contain; }
  .avatar { width: 42px; height: 63px; }
  .avatar-lg { width: 96px; height: 144px; }
  .avatar-row { display: flex; align-items: end; gap: 8px; }
  .notice { display: flex; align-items: flex-start; gap: 12px; border-left: 4px solid var(--amber); background: #fff8e5; padding: 13px 16px; color: #5f4a1e; font-size: 12px; line-height: 1.45; }
  .notice.jade { border-left-color: var(--jade); background: #ecfbf5; color: #155e4b; }
  .empty { min-height: 210px; display: grid; place-items: center; border: 1px dashed #bfc7c3; color: var(--muted); text-align: center; padding: 30px; }
  .bar { height: 7px; background: #e7ebe8; }
  .bar > span { height: 100%; display: block; background: var(--jade); }
  .dot { width: 8px; height: 8px; display: inline-block; border-radius: 50%; background: var(--green); }

  .app-shell { display: grid; grid-template-columns: 238px 1fr; }
  .sidebar { height: 1000px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 28px; background: var(--ink); color: var(--white); padding: 24px 18px; }
  .sidebar .brand { padding: 0 8px; }
  .workspace-label { border-left: 3px solid var(--amber); padding: 2px 10px; }
  .workspace-label strong { display: block; font-size: 12px; }
  .workspace-label span { color: rgba(255,255,255,.62); font-size: 10px; }
  .nav-group { display: grid; gap: 6px; margin-bottom: 20px; }
  .nav-group > strong { padding: 0 10px 5px; color: rgba(255,255,255,.42); font-size: 9px; text-transform: uppercase; }
  .nav-item { min-height: 39px; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; border-radius: 4px; padding: 0 10px; color: rgba(255,255,255,.72); font-size: 12px; font-weight: 700; }
  .nav-item.active { border-color: rgba(39,224,162,.45); background: rgba(39,224,162,.11); color: var(--jade-light); }
  .nav-item span { color: rgba(255,255,255,.35); font-size: 9px; }
  .side-session { border-top: 1px solid rgba(255,255,255,.14); padding: 18px 8px 0; }
  .side-session strong { display: block; font-size: 11px; }
  .side-session span { color: rgba(255,255,255,.5); font-size: 10px; }
  .app-main { min-width: 0; height: 1000px; overflow: hidden; }
  .topbar { height: 62px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--rule); background: var(--white); padding: 0 34px; }
  .crumb { color: var(--muted); font-size: 11px; }
  .context { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; }
  .content { height: 938px; overflow: hidden; padding: 32px 36px 42px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }

  .auth-shell { display: grid; grid-template-columns: 44% 56%; background: var(--paper); }
  .auth-story { position: relative; height: 1000px; overflow: hidden; display: grid; align-content: space-between; background: var(--ink); color: var(--white); padding: 42px 52px; }
  .auth-story h1 { max-width: 520px; margin: 52px 0 18px; font-size: 54px; line-height: 1.02; }
  .auth-story h1 span { display: block; color: var(--jade-light); }
  .auth-story p { max-width: 500px; color: rgba(255,255,255,.7); font-size: 15px; line-height: 1.6; }
  .auth-proof { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid rgba(255,255,255,.16); padding-top: 18px; color: rgba(255,255,255,.76); font-size: 10px; }
  .auth-map { position: absolute; right: -165px; bottom: 130px; width: 630px; border: 1px solid rgba(255,255,255,.28); opacity: .35; }
  .auth-form-side { height: 1000px; display: grid; place-items: center; padding: 52px; }
  .auth-card { width: min(500px, 100%); display: grid; gap: 20px; border-top: 5px solid var(--jade); background: var(--white); padding: 34px; box-shadow: 0 20px 56px rgba(8,13,34,.11); }
  .auth-card h2 { margin: 0; font-size: 30px; }
  .auth-card .form-grid { display: grid; gap: 14px; }

  .step-layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; }
  .steps { border-top: 4px solid var(--amber); background: var(--ink); color: var(--white); padding: 24px; }
  .steps h2 { margin: 0 0 20px; font-size: 19px; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 9px; padding: 13px 0; border-top: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.58); font-size: 11px; }
  .step:first-of-type { border-top: 0; }
  .step b { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; }
  .step.active { color: var(--white); }
  .step.active b { border-color: var(--jade); background: var(--jade); color: var(--ink); }

  .metric-grid { display: grid; grid-template-columns: repeat(4,1fr); border: 1px solid var(--rule); background: var(--white); }
  .metric { min-height: 96px; border-right: 1px solid var(--rule); padding: 16px; }
  .metric:last-child { border-right: 0; }
  .metric span { color: var(--muted); font-size: 10px; }
  .metric strong { display: block; margin: 9px 0 5px; font-size: 23px; }
  .metric small { color: var(--muted); font-size: 9px; }
  .table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .table th { border-bottom: 1px solid var(--rule); padding: 11px 12px; color: var(--muted); text-align: left; font-size: 9px; text-transform: uppercase; }
  .table td { border-bottom: 1px solid #ebeeeb; padding: 11px 12px; }
  .person { display: flex; align-items: center; gap: 10px; }
  .mini-avatar { width: 28px; height: 42px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .thirds { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .list-panel { padding: 20px; }
  .list-panel ul { display: grid; gap: 11px; margin: 14px 0 0; padding: 0; list-style: none; font-size: 11px; }
  .list-panel li { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid #edf0ed; padding-bottom: 9px; }
  .list-panel li:last-child { border-bottom: 0; }

  .office-screen { position: relative; background: var(--ink); }
  .office-global { height: 54px; display: flex; align-items: center; justify-content: space-between; background: var(--ink); color: var(--white); padding: 0 24px; }
  .office-global nav { display: flex; gap: 22px; color: rgba(255,255,255,.68); font-size: 11px; }
  .office-global nav b { color: var(--jade-light); }
  .office-visual { width: 1440px; height: 946px; object-fit: cover; object-position: center; display: block; }
  .office-brand-strip { position: absolute; right: 24px; bottom: 22px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.55); border-radius: 4px; background: rgba(8,13,34,.9); color: var(--white); padding: 10px 14px; font-size: 10px; }

  .utility-screen { display: grid; place-items: center; background: var(--ink); color: var(--white); }
  .utility-card { width: 520px; display: grid; gap: 18px; border-top: 5px solid var(--jade); background: var(--white); color: var(--ink); padding: 34px; }
  .loader-line { height: 6px; overflow: hidden; background: #e7ebe8; }
  .loader-line span { width: 42%; height: 100%; display: block; background: var(--jade); }

  .debug-screen { background: #10141f; color: #e9edf4; padding: 28px; }
  .debug-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #303848; padding-bottom: 18px; }
  .debug-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-top: 22px; }
  .debug-panel { min-height: 350px; border: 1px solid #303848; background: #171d2a; padding: 18px; }
  .debug-panel img { width: 100%; height: 270px; object-fit: contain; image-rendering: pixelated; }
</style>
<script>
  (function () {
    var A = "../../workmap/apps/web/public/marketing/avatars/avatar-";
    var MAP = "workmap-virtual-office-panorama.png";
    function avatar(index, cls) {
      return '<img class="pixel ' + (cls || "avatar") + '" src="' + A + String(index).padStart(2, "0") + '.png" alt="">';
    }
    function badge(text, tone) { return '<span class="badge ' + (tone || "") + '">' + text + '</span>'; }
    function button(text, tone) { return '<button class="btn ' + (tone || "") + '">' + text + '</button>'; }
    function header(eyebrow, title, subtitle, actions) {
      return '<div class="page-head"><div><p class="eyebrow">' + eyebrow + '</p><h1 class="page-title">' + title + '</h1><p class="subtitle">' + subtitle + '</p></div><div class="actions">' + (actions || "") + '</div></div>';
    }
    function navItem(label, route, active) {
      return '<div class="nav-item ' + (active === route ? "active" : "") + '">' + label + '<span>›</span></div>';
    }
    function appShell(active, title, body, role, platform) {
      var nav = platform
        ? '<div class="nav-group"><strong>Platform</strong>' + navItem("Platform Admin", "platform", active) + '</div>'
        : '<div class="nav-group"><strong>Workspace</strong>' +
          navItem("Employees", "employees", active) + navItem("Virtual Office", "office", active) +
          '</div><div class="nav-group"><strong>Insights</strong>' +
          navItem("Dashboard", "dashboard", active) + navItem("Reports", "reports", active) + navItem("Compliance", "compliance", active) +
          '</div><div class="nav-group"><strong>Admin</strong>' +
          navItem("Invites", "invites", active) + navItem("Integrations", "integrations", active) + navItem("Settings", "settings", active) + '</div>';
      return '<div class="screen app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">WM</span>WorkMap</div>' +
        '<div class="workspace-label"><strong>' + (platform ? "Platform context" : "Demo workspace") + '</strong><span>' + (platform ? "Independent access boundary" : "Current workspace") + '</span></div>' +
        '<nav>' + nav + '</nav><div class="side-session"><strong>' + (role || "Owner") + '</strong><span>Signed in · Log out</span></div></aside>' +
        '<main class="app-main"><div class="topbar"><span class="crumb">WorkMap / ' + title + '</span><span class="context"><i class="dot"></i>' + (platform ? "Platform access" : "Workspace connected") + '</span></div><div class="content">' + body + '</div></main></div>';
    }
    function authShell(title, accent, intro, card) {
      return '<div class="screen auth-shell"><section class="auth-story"><div><div class="brand"><span class="brand-mark">WM</span>WorkMap</div><h1>' + title + '<span>' + accent + '</span></h1><p>' + intro + '</p><div class="avatar-row">' + avatar(1) + avatar(3) + avatar(5) + avatar(7) + '</div></div><img class="auth-map" src="' + MAP + '" alt=""><div class="auth-proof"><span>Transparent signals</span><span>Clear boundaries</span><span>People first</span></div></section><section class="auth-form-side">' + card + '</section></div>';
    }
    function field(label, placeholder, type) {
      return '<div class="field"><label>' + label + '</label>' + (type === "select" ? '<select><option>' + placeholder + '</option></select>' : '<input placeholder="' + placeholder + '">') + '</div>';
    }
    function stepList(active) {
      var steps = ["Workspace", "Transparency", "Avatar", "Devices", "Invite team"];
      return '<aside class="steps"><h2>Workspace setup</h2>' + steps.map(function (s, i) { return '<div class="step ' + (i === active ? "active" : "") + '"><b>' + (i + 1) + '</b><span>' + s + '</span></div>'; }).join("") + '</aside>';
    }
    function metric(label, value, detail) { return '<div class="metric"><span>' + label + '</span><strong>' + value + '</strong><small>' + detail + '</small></div>'; }
    function personRow(index, name, role, status, active, idle) {
      return '<tr><td><div class="person">' + avatar(index, "mini-avatar") + '<div><strong>' + name + '</strong><div class="small">' + role + '</div></div></div></td><td><span class="dot"></span> ' + status + '</td><td>' + active + '</td><td>' + idle + '</td><td><button class="btn">View</button></td></tr>';
    }

    var screens = {};
    screens.login = function () {
      var card = '<div class="auth-card"><div>' + badge("Secure account access", "jade") + '<h2 style="margin-top:14px">Sign in to WorkMap</h2><p class="small">Use the same account for your workspace and invitation.</p></div><div class="form-grid">' +
        field("Email", "name@company.com") + field("Password", "Enter your password") +
        '<div style="display:flex;justify-content:space-between" class="small"><span>Remember this device</span><span>Forgot password?</span></div>' +
        button("Sign in →", "primary") + '</div><div class="rule"></div><div class="small">New Owner? <strong>Create an Owner account</strong></div></div>';
      return authShell("Start with your workspace.", "Bring the team in clearly.", "Create an Owner workspace first, then invite employees through tenant-scoped links. Private content always stays outside WorkMap.", card);
    };
    screens.callback = function () {
      return '<div class="screen utility-screen"><div class="utility-card"><div class="brand"><span class="brand-mark">WM</span>WorkMap</div><div>' + badge("Cognito callback", "jade") + '<h1 style="margin:16px 0 8px;font-size:34px">Signing in</h1><p class="subtitle">Verifying your account and resolving the correct workspace.</p></div><div class="loader-line"><span></span></div><div class="small">You will continue automatically. <strong>Back to login</strong></div></div></div>';
    };
    screens.company = function () {
      var form = '<div class="step-layout">' + stepList(0) + '<section class="panel" style="padding:28px"><div style="display:grid;gap:18px">' +
        '<div><h2 class="panel-title">Workspace details</h2><p class="small">Create the company workspace and confirm how teammates see you.</p></div>' +
        '<div class="split">' + field("Company name", "Your company") + field("Workspace name", "Main workspace") + '</div>' +
        field("Your display name", "How teammates should see you") +
        '<div class="notice jade"><strong>Privacy-forward setup</strong><span>Tracking boundaries are reviewed before employees join.</span></div>' +
        '<div class="actions" style="justify-content:flex-end">' + button("Create workspace →", "primary") + '</div></div></section></div>';
      return appShell("", "Create workspace", header("Owner onboarding", "Create your WorkMap workspace", "Create the company workspace, confirm your profile, then invite employees into the same tenant.") + form, "Owner");
    };
    screens["invite-owner"] = function () {
      var body = header("Owner onboarding", "Invite employees", "Create tenant-scoped invitation links for employees to join this WorkMap workspace.", button("Open office", "primary")) +
        '<div class="split"><section class="panel" style="padding:24px"><h2 class="panel-title">Create invitation</h2><div style="display:grid;gap:14px;margin-top:18px">' +
        field("Employee email", "employee@company.com") + field("Role", "Employee", "select") + button("Create invite link →", "primary") +
        '<div class="notice"><strong>One workspace only</strong><span>The verified Cognito email must match this invitation.</span></div></div></section>' +
        '<section class="panel" style="padding:24px"><div style="display:flex;justify-content:space-between"><h2 class="panel-title">Recent invitations</h2>' + badge("Live API", "jade") + '</div><div class="empty"><div><strong>No invitations yet</strong><p class="small">Created links will appear here with role and expiry.</p></div></div></section></div>';
      return appShell("invites", "Invites", body, "Owner");
    };
    screens["invite-token"] = function () {
      var card = '<div class="auth-card"><div>' + badge("WorkMap invitation", "amber") + '<h2 style="margin-top:14px">Join workspace</h2><p class="small">Use the exact verified email address that received this invitation.</p></div><div class="form-grid">' +
        '<div class="field"><label>Invited account</label><input value="Verified invited email" disabled></div>' +
        field("Your display name", "How teammates should see you") +
        '<div class="notice jade"><strong>What happens next</strong><span>Review transparency, create your avatar, then connect your devices.</span></div>' +
        button("Accept and continue →", "primary") + '</div></div>';
      return authShell("One invitation.", "One clear workspace.", "WorkMap binds each invitation to the verified employee account and the intended tenant.", card);
    };
    screens.avatar = function () {
      var optionRows = ["Body", "Eyes", "Hairstyle", "Outfit", "Accessory"].map(function (label, i) {
        return '<div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px;border-top:1px solid var(--rule);padding:13px 0"><strong style="font-size:11px">' + label + '</strong><div class="avatar-row">' + avatar(i + 1, "mini-avatar") + avatar(i + 2, "mini-avatar") + avatar(i + 3, "mini-avatar") + avatar(i + 4, "mini-avatar") + '</div></div>';
      }).join("");
      var body = header("Choose your avatar", "Create your WorkMap avatar", "Choose how you appear in the Virtual Office.") +
        '<div class="step-layout">' + stepList(2) + '<div class="split" style="grid-template-columns:1.35fr .65fr"><section class="panel" style="padding:22px"><h2 class="panel-title">Build your avatar</h2>' +
        '<div style="margin-top:12px">' + optionRows + '</div></section><section class="panel" style="display:grid;align-content:center;justify-items:center;gap:18px;padding:24px;background:var(--ink-soft);color:var(--white)">' +
        badge("Your avatar", "jade") + avatar(6, "avatar-lg") + '<strong>Preview in office</strong>' + button("Save and continue →", "primary") + '</section></div></div>';
      return appShell("", "Avatar setup", body, "Workspace member");
    };
    screens.device = function () {
      var lane = '<div class="thirds" style="margin-bottom:18px"><div class="notice jade"><strong>Desktop Agent</strong><span>App name + duration. Stops while idle or locked.</span></div><div class="notice jade"><strong>Browser Extension</strong><span>Hostname + duration. No URL path or page content.</span></div><div class="notice"><strong>Not collected</strong><span>No screenshots, keystrokes, clipboard, camera, or microphone.</span></div></div>';
      var desktop = '<section class="panel" style="padding:24px"><div style="display:flex;justify-content:space-between">' + badge("Windows", "jade") + badge("Not paired") + '</div><h2 class="panel-title" style="margin-top:16px">Desktop Agent</h2><p class="small">Install once, then connect this computer with a short-lived code.</p><ol class="small" style="line-height:1.8;padding-left:18px"><li>Download and open the installer.</li><li>Generate a one-time code.</li><li>Wait for connected confirmation.</li></ol><div class="actions">' + button("Download installer", "ink") + button("Generate code", "primary") + '</div></section>';
      var extension = '<section class="panel" style="padding:24px"><div style="display:flex;justify-content:space-between">' + badge("Chrome / Edge", "amber") + badge("Alpha") + '</div><h2 class="panel-title" style="margin-top:16px">Browser Extension</h2><p class="small">Load the unpacked extension, then connect it with its own code.</p><ol class="small" style="line-height:1.8;padding-left:18px"><li>Download and extract the ZIP.</li><li>Load unpacked in Developer mode.</li><li>Generate a one-time code.</li></ol><div class="actions">' + button("Download ZIP", "ink") + button("Generate code", "primary") + '</div></section>';
      var body = header("Device setup", "Connect WorkMap presence tools", "Pair each visible client separately. Employees can pause or stop either client.", button("Continue later")) + lane + '<div class="split">' + desktop + extension + '</div>';
      return appShell("", "Device setup", body, "Workspace member");
    };
    screens.dashboard = function () {
      var metrics = '<div class="metric-grid">' + metric("Team active time", "32h 40m", "8 active employees today") + metric("Focus room usage", "6h 15m", "Engineering and Finance") + metric("Idle time", "3h 05m", "Normal daily range") + metric("Devices online", "11 / 12", "One delayed") + '</div>';
      var people = '<section class="panel" style="padding:20px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h2 class="panel-title">Team presence</h2>' + badge("Development fallback", "amber") + '</div><table class="table"><thead><tr><th>Employee</th><th>Status</th><th>Active</th><th>Idle</th><th></th></tr></thead><tbody>' +
        personRow(1,"Mia Manager","Engineering Manager","Busy","5h 20m","22m") + personRow(2,"Ethan Engineer","Software Engineer","Focus","6h 05m","18m") + personRow(3,"Sofia Sales","Account Executive","Available","4h 45m","31m") + '</tbody></table></section>';
      var usage = '<section class="panel list-panel"><h2 class="panel-title">Top apps</h2><ul><li><span>Visual Studio Code</span><strong>8h 25m</strong></li><li><span>Microsoft Teams</span><strong>5h 10m</strong></li><li><span>Figma</span><strong>3h 35m</strong></li></ul></section><section class="panel list-panel"><h2 class="panel-title">Top domains</h2><ul><li><span>github.com</span><strong>4h 55m</strong></li><li><span>office.com</span><strong>3h 20m</strong></li><li><span>figma.com</span><strong>2h 50m</strong></li></ul></section>';
